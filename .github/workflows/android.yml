name: Compilar APK Honor
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --user --upgrade buildozer cython==0.29.33

      - name: Aceptar Licencias de Android y Compilar
        run: |
          # Crear carpeta de licencias para evitar el bloqueo interactivo
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          # Aceptar todas las licencias del SDK directamente
          yes | sdkmanager --licenses || true
          # Ejecutar la compilación
          buildozer android debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Subir APK Resultante
        uses: actions/upload-artifact@v4
        with:
          name: MiAppNotas-Honor
          path: bin/*.apk
